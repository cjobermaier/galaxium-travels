name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r booking_system_backend/requirements.txt

      - name: Run tests
        run: pytest
        working-directory: booking_system_backend

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        working-directory: booking_system_frontend

      - name: Lint
        run: npm run lint
        working-directory: booking_system_frontend

      - name: Build
        run: npm run build
        working-directory: booking_system_frontend

  e2e:
    name: E2E tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r e2e/requirements.txt

      - name: Run E2E tests
        run: pytest
        working-directory: e2e
